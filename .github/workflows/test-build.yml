name: Test Build iOS App

on:
  workflow_dispatch:
    inputs:
      ios-app-ref:
        description: 'Commit hash, tag, or branch of owncloud/ios-app to build'
        required: true
        type: string

jobs:
  call-build:
    uses: owncloud/ios-scenario-testing/.github/workflows/build-ios-app.yml@technical/ci_adaption
    with:
      ios-app-ref: ${{ inputs.ios-app-ref }}

  call-e2e-tests:
    needs: call-build
    uses: owncloud/ios-scenario-testing/.github/workflows/run-e2e-tests.yml@technical/ci_adaption
    with:
      artifact-name: ${{ needs.call-build.outputs.artifact-name }}
    secrets: inherit
