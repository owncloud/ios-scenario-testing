[versions]
cucumber = "7.31.0"
apacheCommonsExec = "1.3"
apacheCommonsLang = "3.9"
apacheCommonsText = "1.9"
apacheCommonsCodec = "1.22.0"
apacheCommonsIo = "2.6"
byteBuddy = "1.18.8"
guava = "30.1-jre"
javaClient = "10.1.1"
okhttp = "5.3.2"
okio = "3.17.0"
json = "20250107"
slf4jApi = "2.0.17"
junit = "4.13.1"
assertjCore = "3.27.7"
slf4j = "2.0.17"

[libraries]
cucumber-java = { module = "io.cucumber:cucumber-java", version.ref = "cucumber" }
cucumber-junit = { module = "io.cucumber:cucumber-junit", version.ref = "cucumber" }
cucumber-core = { module = "io.cucumber:cucumber-core", version.ref = "cucumber" }
cucumber-picocontainer = { module = "io.cucumber:cucumber-picocontainer", version.ref = "cucumber" }

apache-commons-exec = { module = "org.apache.commons:commons-exec", version.ref = "apacheCommonsExec" }
apache-commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "apacheCommonsLang" }
apache-commons-text = { module = "org.apache.commons:commons-text", version.ref = "apacheCommonsText" }
apache-commons-codec = { module = "commons-codec:commons-codec", version.ref = "apacheCommonsCodec" }
apache-commons-io = { module = "commons-io:commons-io", version.ref = "apacheCommonsIo" }

byte-buddy = { module = "net.bytebuddy:byte-buddy", version.ref = "byteBuddy" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }

appium-java-client = { module = "io.appium:java-client", version.ref = "javaClient" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

json = { module = "org.json:json", version.ref = "json" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4jApi" }

slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
junit = { module = "junit:junit", version.ref = "junit" }

assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertjCore" }

[bundles]
cucumber = [
    "cucumber-java",
    "cucumber-junit",
    "cucumber-core",
    "cucumber-picocontainer"
]

appium   = [
    "appium-java-client",
    "byte-buddy",
    "guava"
]
http     = [
    "okhttp",
    "okio"
]

commons  = [
    "apache-commons-exec",
    "apache-commons-lang3",
    "apache-commons-text",
    "apache-commons-codec",
    "apache-commons-io"
]

testing  = [
    "junit",
    "assertj-core",
    "slf4j-api"
]
